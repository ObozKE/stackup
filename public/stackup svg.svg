<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <!-- Definitions for the precise geometric cuts in the logo -->
  <defs>
    <mask id="logo-cuts">
      <!-- Base canvas: keep everything white by default -->
      <rect width="140" height="140" fill="white" />
      
      <!-- Vertical center gap -->
      <rect x="67" y="0" width="6" height="140" fill="black" />
      
      <!-- Horizontal upper gap -->
      <rect x="0" y="40" width="140" height="6" fill="black" />
      
      <!-- Horizontal lower gap -->
      <rect x="0" y="74" width="140" height="6" fill="black" />
    </mask>
  </defs>

  <!-- Apply the mask and official brand red -->
  <g mask="url(#logo-cuts)" stroke="#DA011A" stroke-width="15" fill="none" stroke-linecap="butt">
    
    <!-- Outer 'U' / Shield Shape -->
    <!-- Starts just below the top gap and curves under the bottom gap -->
    <path d="M 20 46 L 20 80 A 50 50 0 0 0 120 80 L 120 46" />
    
    <!-- Inner 'S' Shape -->
    <!-- A mathematically perfect continuous S-curve masked by the gaps -->
    <path d="M 90 40 A 20 20 0 0 0 50 40 C 50 60, 90 60, 90 80 A 20 20 0 0 1 50 80" />
    
  </g>
</svg>
